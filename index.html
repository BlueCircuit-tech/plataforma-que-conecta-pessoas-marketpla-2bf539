<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>TrabalhaJá</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        marca: {
                            50: '#f5f3ff',
                            100: '#ede9fe',
                            200: '#ddd6fe',
                            300: '#c4b5fd',
                            400: '#a78bfa',
                            500: '#8B5CF6',
                            600: '#7c3aed',
                            700: '#6d28d9',
                            800: '#5b21b6',
                            900: '#4C1D95',
                            950: '#3b1577'
                        }
                    },
                    fontFamily: {
                        display: ['"Bricolage Grotesque"', 'system-ui', 'sans-serif'],
                        body: ['"Figtree"', 'system-ui', 'sans-serif']
                    },
                    boxShadow: {
                        'app': '0 -4px 30px rgba(76,29,149,0.08)',
                        'card': '0 2px 12px rgba(76,29,149,0.07)',
                        'card-hover': '0 8px 25px rgba(76,29,149,0.12)',
                        'elevated': '0 12px 40px rgba(76,29,149,0.15)',
                        'glow': '0 0 20px rgba(139,92,246,0.25)',
                        'nav': '0 -2px 20px rgba(0,0,0,0.06)'
                    },
                    borderRadius: {
                        'app': '28px',
                        'app-sm': '14px',
                        'card': '16px',
                        'btn': '14px'
                    }
                }
            }
        }
    </script>
    <style>
        * { -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Figtree', system-ui, sans-serif;
            background: #1a1a2e;
            background-image: radial-gradient(circle at 20% 50%, rgba(76,29,149,0.3) 0%, transparent 50%),
                              radial-gradient(circle at 80% 20%, rgba(139,92,246,0.2) 0%, transparent 50%),
                              radial-gradient(circle at 50% 80%, rgba(76,29,149,0.15) 0%, transparent 50%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        #phone-frame {
            width: 390px;
            height: 844px;
            background: #FAF5FF;
            border-radius: 44px;
            border: 3px solid #2d2d3f;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 0 4px #1a1a2e, 0 0 0 7px #3d3d52, 0 30px 80px rgba(0,0,0,0.5), 0 0 40px rgba(76,29,149,0.2);
        }
        @media (max-width: 430px) {
            #phone-frame {
                width: 100vw;
                height: 100vh;
                border-radius: 0;
                border: none;
                box-shadow: none;
            }
            body { align-items: stretch; }
        }
        #status-bar {
            background: #4C1D95;
            height: 50px;
            padding: 14px 28px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            font-family: 'Figtree', sans-serif;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
            position: relative;
            z-index: 10;
        }
        #app-container {
            height: calc(100% - 50px - 68px);
            overflow-y: auto;
            overflow-x: hidden;
            scroll-behavior: smooth;
            background: #FAF5FF;
        }
        @media (max-width: 430px) {
            #app-container {
                height: calc(100% - 50px - 68px);
            }
        }
        #app-container::-webkit-scrollbar { width: 0; }
        #app-container { scrollbar-width: none; }

        @keyframes telaEntrada {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        [data-tela] { animation: telaEntrada 0.32s ease-out both; }
        *:focus-visible {
            outline: 2.5px solid #8B5CF6;
            outline-offset: 3px;
            border-radius: 8px;
        }

        .badge {
            display: inline-flex; align-items: center; justify-content: center;
            min-width: 22px; height: 22px; padding: 0 7px;
            border-radius: 11px; font-size: 11px; font-weight: 700;
            background: #8B5CF6; color: #fff; line-height: 1;
        }
        .card {
            background: #fff; border-radius: 16px;
            padding: 16px; box-shadow: 0 2px 12px rgba(76,29,149,0.07);
            transition: box-shadow 0.25s, transform 0.25s;
        }
        .card:active { transform: scale(0.985); box-shadow: 0 1px 6px rgba(76,29,149,0.05); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 8px;
            padding: 14px 24px; border-radius: 14px; font-weight: 600;
            font-size: 15px; border: none; cursor: pointer;
            transition: all 0.2s ease; font-family: 'Figtree', sans-serif;
            letter-spacing: 0.01em; white-space: nowrap;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary {
            background: linear-gradient(135deg, #6d28d9, #8B5CF6);
            color: #fff; box-shadow: 0 4px 14px rgba(76,29,149,0.3);
        }
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(76,29,149,0.4); }
        .btn-primary:active { box-shadow: 0 2px 8px rgba(76,29,149,0.25); }
        .btn-secondary {
            background: #fff; color: #4C1D95;
            border: 1.5px solid #ddd6fe;
        }
        .btn-secondary:hover { background: #f5f3ff; }
        .btn-ghost {
            background: transparent; color: #6d28d9;
            padding: 10px 16px;
        }
        .btn-ghost:hover { background: #f5f3ff; }
        .btn-sm { padding: 10px 18px; font-size: 13px; border-radius: 10px; }

        #nav-bar {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 68px; background: #fff;
            display: flex; align-items: center; justify-content: space-around;
            padding: 0 4px; padding-bottom: env(safe-area-inset-bottom, 0);
            box-shadow: 0 -2px 20px rgba(0,0,0,0.06);
            border-top: 1px solid #f0edff; z-index: 50;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 6px 2px; border: none; background: none; cursor: pointer;
            color: #a1a1aa; transition: color 0.2s; min-width: 56px;
            font-family: 'Figtree', sans-serif; position: relative;
        }
        .nav-btn svg { transition: transform 0.2s, color 0.2s; }
        .nav-btn span {
            font-size: 10px; font-weight: 500;
            line-height: 1; letter-spacing: 0.01em;
        }
        .nav-btn.ativo { color: #4C1D95; }
        .nav-btn.ativo svg { transform: scale(1.1); color: #8B5CF6; }
        .nav-btn .nav-dot {
            display: none; width: 4px; height: 4px; border-radius: 50%;
            background: #8B5CF6; margin-top: 1px;
        }
        .nav-btn.ativo .nav-dot { display: block; }

        #toast-container {
            position: absolute; top: 60px; left: 12px; right: 12px;
            z-index: 200; display: flex; flex-direction: column; gap: 8px;
            pointer-events: none;
        }
        .toast-item {
            padding: 12px 16px; border-radius: 12px; color: #fff;
            font-size: 13px; font-weight: 500;
            display: flex; align-items: center; gap: 8px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.2);
            animation: toastIn 0.3s ease-out, toastOut 0.3s ease-in 2.7s forwards;
            pointer-events: auto;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-20px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity: 1; transform: translateY(0) scale(1); }
            to   { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }
        .toast-ok    { background: #059669; }
        .toast-erro  { background: #dc2626; }
        .toast-info  { background: #4C1D95; }

        #modal-overlay {
            display: none; position: absolute; inset: 0; z-index: 150;
            background: rgba(0,0,0,0.5); backdrop-filter: blur(3px);
            align-items: flex-end; justify-content: center;
        }
        #modal-overlay.open { display: flex; }
        #modal-card {
            background: #fff; border-radius: 24px 24px 0 0;
            width: 100%; max-height: 82%; display: flex; flex-direction: column;
            animation: modalUp 0.3s ease-out;
        }
        @keyframes modalUp {
            from { transform: translateY(100%); }
            to   { transform: translateY(0); }
        }
        #modal-header {
            padding: 16px 20px 12px; border-bottom: 1px solid #f0edff;
            display: flex; justify-content: space-between; align-items: center;
            flex-shrink: 0;
        }
        #modal-body { padding: 20px; overflow-y: auto; flex: 1; }
        #modal-close {
            width: 32px; height: 32px; border-radius: 50%;
            border: none; background: #f5f3ff; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            color: #4C1D95; transition: background 0.2s;
        }
        #modal-close:hover { background: #ede9fe; }

        .gradient-brand {
            background: linear-gradient(135deg, #4C1D95 0%, #8B5CF6 60%, #a78bfa 100%);
        }
        .gradient-brand-soft {
            background: linear-gradient(145deg, #f5f3ff 0%, #ede9fe 50%, #f5f3ff 100%);
        }

        .skeleton {
            background: linear-gradient(90deg, #f0edff 25%, #e9e5ff 50%, #f0edff 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer {
            0%   { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        .step-dot {
            width: 28px; height: 28px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 12px; font-weight: 700; flex-shrink: 0;
            transition: all 0.3s;
        }
        .step-dot.done  { background: #8B5CF6; color: #fff; }
        .step-dot.active { background: #fff; color: #8B5CF6; border: 2.5px solid #8B5CF6; }
        .step-dot.pending { background: #e9e5ff; color: #a1a1aa; }
        .step-line { flex: 1; height: 2px; background: #e9e5ff; transition: background 0.3s; }
        .step-line.done { background: #8B5CF6; }

        input, select, textarea {
            font-family: 'Figtree', sans-serif;
        }
        .ripple {
            position: relative; overflow: hidden;
        }
        .ripple::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle, rgba(139,92,246,0.15) 0%, transparent 70%);
            opacity: 0; transition: opacity 0.3s;
            border-radius: inherit;
        }
        .ripple:active::after { opacity: 1; }
    </style>
</head>
<body>

<div id="phone-frame">
    <div id="status-bar">
        <span id="clock">12:00</span>
        <div class="flex items-center gap-1.5">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor" opacity="0.9">
                <rect x="0" y="5" width="3" height="7" rx="0.8" opacity="0.35"/>
                <rect x="4" y="3.5" width="3" height="8.5" rx="0.8" opacity="0.55"/>
                <rect x="8" y="2" width="3" height="10" rx="0.8" opacity="0.75"/>
                <rect x="12" y="0" width="3" height="12" rx="0.8"/>
            </svg>
            <svg width="14" height="12" viewBox="0 0 14 12" fill="currentColor" opacity="0.85">
                <path d="M7 8.5C8.8 8.5 10.4 7.8 11.5 6.6L13 8.1C11.6 9.6 9.4 10.5 7 10.5C4.6 10.5 2.4 9.6 1 8.1L2.5 6.6C3.6 7.8 5.2 8.5 7 8.5Z" opacity="0.4"/>
                <rect x="5.5" y="4.5" width="3" height="4" rx="1" opacity="0.8"/>
                <circle cx="7" cy="3" r="1" opacity="0.9"/>
            </svg>
            <svg width="25" height="12" viewBox="0 0 25 12" fill="currentColor">
                <rect x="0" y="0" width="22" height="12" rx="2.5" stroke="currentColor" stroke-width="1" fill="none" opacity="0.35"/>
                <rect x="22.5" y="4" width="2" height="4" rx="0.8"/>
                <rect x="1.5" y="1.5" width="18" height="9" rx="1.2" fill="currentColor" opacity="0.9"/>
            </svg>
        </div>
    </div>

    <div id="app-container">
        <!-- TELAS -->
    </div>

    <nav id="nav-bar" aria-label="Navegação principal">
        <button class="nav-btn" data-nav="home" onclick="mostrarTela('home')" aria-label="Home">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span>Home</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="catalogo" onclick="mostrarTela('catalogo')" aria-label="Catálogo">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="1.5"/>
                <rect x="14" y="3" width="7" height="7" rx="1.5"/>
                <rect x="3" y="14" width="7" height="7" rx="1.5"/>
                <rect x="14" y="14" width="7" height="7" rx="1.5"/>
            </svg>
            <span>Catálogo</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="detalhe-do-profissional" onclick="mostrarTela('detalhe-do-profissional')" aria-label="Profissional">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Profissional</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="agendamento" onclick="mostrarTela('agendamento')" aria-label="Agendar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3"/>
                <line x1="16" y1="2" x2="16" y2="6"/>
                <line x1="8" y1="2" x2="8" y2="6"/>
                <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            <span>Agendar</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="confirmacao-do-pedido" onclick="mostrarTela('confirmacao-do-pedido')" aria-label="Confirmação">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12"/>
            </svg>
            <span>Confirmação</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="acompanhar-pedido" onclick="mostrarTela('acompanhar-pedido')" aria-label="Acompanhar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="12 6 12 12 16 14"/>
            </svg>
            <span>Acompanhar</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="meus-pedidos" onclick="mostrarTela('meus-pedidos')" aria-label="Pedidos">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                <polyline points="14 2 14 8 20 8"/>
                <line x1="16" y1="13" x2="8" y2="13"/>
                <line x1="16" y1="17" x2="8" y2="17"/>
                <polyline points="10 9 9 9 8 9"/>
            </svg>
            <span>Pedidos</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="chat" onclick="mostrarTela('chat')" aria-label="Chat">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
            </svg>
            <span>Chat</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="perfil" onclick="mostrarTela('perfil')" aria-label="Perfil">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <span>Perfil</span>
            <div class="nav-dot"></div>
        </button>
        <button class="nav-btn" data-nav="painel-admin" onclick="mostrarTela('painel-admin')" aria-label="Admin">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"/>
                <line x1="12" y1="20" x2="12" y2="4"/>
                <line x1="6" y1="20" x2="6" y2="14"/>
            </svg>
            <span>Admin</span>
            <div class="nav-dot"></div>
        </button>
    </nav>

    <div id="toast-container" aria-live="polite"></div>

    <div id="modal-overlay" role="dialog" aria-modal="true">
        <div id="modal-card">
            <div id="modal-header">
                <h3 id="modal-title" class="font-display font-bold text-marca-900 text-lg"></h3>
                <button id="modal-close" onclick="fecharModal()" aria-label="Fechar modal">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>
</div>

<script>
function mostrarTela(id) {
    document.querySelectorAll('[data-tela]').forEach(function (s) {
        s.classList.toggle('hidden', s.dataset.tela !== id);
    });
    document.querySelectorAll('[data-nav]').forEach(function (b) {
        b.classList.toggle('ativo', b.dataset.nav === id);
    });
    var container = document.getElementById('app-container');
    if (container) container.scrollTop = 0;
    window.scrollTo({ top: 0 });
}

function toast(mensagem, tipo) {
    tipo = tipo || 'info';
    var container = document.getElementById('toast-container');
    var div = document.createElement('div');
    div.className = 'toast-item toast-' + tipo;
    var icons = {
        ok: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
        erro: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>',
        info: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
    };
    div.innerHTML = (icons[tipo] || icons.info) + '<span>' + mensagem + '</span>';
    container.appendChild(div);
    setTimeout(function () { if (div.parentNode) div.remove(); }, 3000);
}

function abrirModal(html, titulo) {
    document.getElementById('modal-title').textContent = titulo || '';
    document.getElementById('modal-body').innerHTML = html;
    document.getElementById('modal-overlay').classList.add('open');
}

function fecharModal() {
    document.getElementById('modal-overlay').classList.remove('open');
}

document.getElementById('modal-overlay').addEventListener('click', function (e) {
    if (e.target === this) fecharModal();
});
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') fecharModal();
});

function brl(valor) {
    return 'R$ ' + Number(valor).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function dataBR(iso) {
    if (!iso) return '';
    var d = new Date(iso + 'T00:00:00');
    return d.getDate().toString().padStart(2, '0') + '/' + (d.getMonth() + 1).toString().padStart(2, '0') + '/' + d.getFullYear();
}

function inicializarRelogio() {
    function atualizar() {
        var el = document.getElementById('clock');
        if (!el) return;
        var agora = new Date();
        var h = agora.getHours().toString().padStart(2, '0');
        var m = agora.getMinutes().toString().padStart(2, '0');
        el.textContent = h + ':' + m;
    }
    atualizar();
    setInterval(atualizar, 30000);
}

document.addEventListener('DOMContentLoaded', function () {
    inicializarRelogio();
    mostrarTela('home');
});
</script>

</body>
</html>
